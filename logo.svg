<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f6f1e8" stroke="#174d3b" stroke-width="3"/>
  
  <!-- Chronos head (bearded Greek god) -->
  <circle cx="100" cy="60" r="25" fill="#d4a574"/>
  
  <!-- Beard -->
  <path d="M 80 75 Q 75 85 80 90 Q 100 95 120 90 Q 125 85 120 75" fill="#b8926f"/>
  
  <!-- Curly hair -->
  <circle cx="85" cy="50" r="8" fill="#b8926f"/>
  <circle cx="92" cy="45" r="7" fill="#b8926f"/>
  <circle cx="100" cy="42" r="8" fill="#b8926f"/>
  <circle cx="108" cy="45" r="7" fill="#b8926f"/>
  <circle cx="115" cy="50" r="8" fill="#b8926f"/>
  
  <!-- Eyes -->
  <circle cx="90" cy="57" r="3" fill="#1a1a1a"/>
  <circle cx="110" cy="57" r="3" fill="#1a1a1a"/>
  
  <!-- Laurel wreath around head -->
  <path d="M 70 55 Q 60 60 65 75" stroke="#2d5a2d" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="68" cy="58" r="2" fill="#2d5a2d"/>
  <circle cx="65" cy="65" r="2" fill="#2d5a2d"/>
  <circle cx="62" cy="72" r="2" fill="#2d5a2d"/>
  
  <path d="M 130 55 Q 140 60 135 75" stroke="#2d5a2d" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="132" cy="58" r="2" fill="#2d5a2d"/>
  <circle cx="135" cy="65" r="2" fill="#2d5a2d"/>
  <circle cx="138" cy="72" r="2" fill="#2d5a2d"/>
  
  <!-- Hourglass (symbol of time) -->
  <g transform="translate(100, 110)">
    <!-- Top bulb -->
    <path d="M -12 -20 L -8 -5 L 8 -5 L 12 -20 Z" fill="#174d3b" stroke="#174d3b" stroke-width="1.5"/>
    <!-- Center line (sand flowing) -->
    <line x1="-1" y1="-5" x2="1" y2="5" stroke="#d4a574" stroke-width="1.5"/>
    <!-- Bottom bulb -->
    <path d="M -12 20 L -8 5 L 8 5 L 12 20 Z" fill="#174d3b" stroke="#174d3b" stroke-width="1.5"/>
    <!-- Hourglass frame -->
    <rect x="-15" y="-25" width="30" height="50" fill="none" stroke="#174d3b" stroke-width="1.5" rx="2"/>
  </g>
  
  <!-- Calendar grid (12 small squares for calendar) -->
  <g transform="translate(100, 160)">
    <rect x="-18" y="-5" width="4" height="4" fill="#12634a"/>
    <rect x="-10" y="-5" width="4" height="4" fill="#12634a"/>
    <rect x="-2" y="-5" width="4" height="4" fill="#12634a"/>
    <rect x="6" y="-5" width="4" height="4" fill="#12634a"/>
    
    <rect x="-18" y="3" width="4" height="4" fill="#12634a"/>
    <rect x="-10" y="3" width="4" height="4" fill="#12634a"/>
    <rect x="-2" y="3" width="4" height="4" fill="#12634a"/>
    <rect x="6" y="3" width="4" height="4" fill="#12634a"/>
  </g>
  
  <!-- Greek key pattern border (small decorative elements) -->
  <circle cx="30" cy="100" r="3" fill="#2d5a2d" opacity="0.6"/>
  <circle cx="170" cy="100" r="3" fill="#2d5a2d" opacity="0.6"/>
  <circle cx="100" cy="30" r="3" fill="#2d5a2d" opacity="0.6"/>
  <circle cx="100" cy="170" r="3" fill="#2d5a2d" opacity="0.6"/>
</svg>
